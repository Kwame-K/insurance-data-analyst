[project]
name = "insurance-data-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kristian", email = "kristian.klaban@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
insurance-data-analyst-agent = "insurance_data_analyst_agent:main"
insurance-data-analyst = "insurance_data_analyst_agent.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
